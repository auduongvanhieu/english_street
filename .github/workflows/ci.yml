name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @es/api prisma generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @es/quests validate
      - run: pnpm --filter @es/quests test
      - name: NPC evals (mock provider)
        run: |
          NPC_PROVIDER=mock pnpm --filter @es/api eval:npc
          NPC_PROVIDER=mock pnpm --filter @es/api eval:pair

  # Admin site end to end: API + game server on a fresh Postgres / Redis (scripts/admin-e2e.mjs).
  admin-e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: es, POSTGRES_PASSWORD: es, POSTGRES_DB: english_street }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://es:es@localhost:5432/english_street
      REDIS_URL: redis://localhost:6379/1
      NPC_PROVIDER: mock
      AUTH_SECRET: ci-secret-for-admin-e2e
      API_PORT: 4000
      GAME_PORT: 2567
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @es/api prisma migrate deploy
      - name: Start API and game server
        run: |
          (cd apps/api && nohup pnpm start > ../../api.log 2>&1 &)
          (cd apps/game-server && nohup pnpm start > ../../game.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/health && curl -sf localhost:2567/health && break; sleep 2; done
      - run: node scripts/admin-e2e.mjs
      - if: failure()
        run: tail -100 api.log game.log

  docker:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, game, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: |
            VITE_API_URL=https://api.example.com
            VITE_GAME_WS_URL=wss://ws.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
