name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @es/api prisma generate
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @es/quests validate
      - name: NPC evals (mock provider)
        run: |
          NPC_PROVIDER=mock pnpm --filter @es/api eval:npc
          NPC_PROVIDER=mock pnpm --filter @es/api eval:pair

  docker:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, game, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.target }}
          push: false
          build-args: |
            VITE_API_URL=https://api.example.com
            VITE_GAME_WS_URL=wss://ws.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
