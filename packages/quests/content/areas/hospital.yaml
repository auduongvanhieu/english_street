quiz:
  - id: sore-throat-medicine
    question: "\"I've got a sore throat.\" What can the pharmacist give you?"
    options: ["throat lozenges", "eye drops", "a bandage", "an ice pack"]
    answer: 0
    level: A2
  - id: twice-meaning
    question: "\"Take it twice a day.\" How many times a day?"
    options: ["2", "1", "3", "12"]
    answer: 0
    level: A2
  - id: teeth-plural
    question: "One tooth, two …"
    options: ["teeth", "tooths", "toothes", "teeths"]
    answer: 0
    level: A1
  - id: feet-plural
    question: "One foot, two …"
    options: ["feet", "foots", "feets", "footes"]
    answer: 0
    level: A1
  - id: advice-should
    question: "Your friend has a fever. What is good advice?"
    options: ["You should rest and drink plenty of water.", "You should go running.", "You shouldn't drink anything.", "You should eat lots of sweets."]
    answer: 0
    level: A2
  - id: cut-plaster
    question: "You have a small cut on your finger. What do you need?"
    options: ["a thermometer", "a plaster", "cough syrup", "ear drops"]
    answer: 1
    level: A1
  - id: after-meals-meaning
    question: "\"Take the tablets after meals.\" When do you take them?"
    options: ["before breakfast", "when you have eaten", "in the night only", "when you are hungry"]
    answer: 1
    level: A2
  - id: ankle-advice
    question: "Choose the best advice for a sprained ankle."
    options: ["Put ice on it and keep your foot up.", "Go to football practice.", "Take some eye drops.", "Use cough syrup."]
    answer: 0
    level: B1
  - id: have-had
    question: "Choose the correct sentence."
    options: ["I've had a cough since three days.", "I've had a cough for three days.", "I have a cough for three days.", "I had a cough since three days."]
    answer: 1
    level: B1
  - id: ambulance-when
    question: "When should you call an ambulance?"
    options: ["when someone is badly hurt", "when you have a small cut", "when you want a plaster", "when you have a runny nose"]
    answer: 0
    level: A2
