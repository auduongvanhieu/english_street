id: hospital
title: City Hospital
intro: Welcome to City Hospital! Learn the parts of the body, say how you feel and help the pharmacist give every patient the right medicine.
categories:
  - { id: body, label: The body }
  - { id: symptoms, label: Symptoms }
  - { id: medicine, label: Medicines }
  - { id: advice, label: Advice and dosage }
  - { id: hospital, label: At the hospital }
groups:
  - { id: feel, label: Saying how you feel }
  - { id: pharmacy, label: At the pharmacy }
  - { id: dosage, label: Understanding the dosage }
  - { id: advice, label: Giving advice }
  - { id: hospital, label: Finding your way }
