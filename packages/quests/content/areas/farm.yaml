id: farm
title: Green Valley Farm
intro: Meet the farm animals, grow your own vegetables and sell them at the market. Every job on the farm teaches you an action word.
categories:
  - { id: animals, label: Farm animals }
  - { id: crops, label: Fruit and vegetables }
  - { id: jobs, label: Farm jobs }
  - { id: tools, label: "Tools and things" }
  - { id: places, label: "People and places" }
  - { id: products, label: "Farm products" }
groups:
  - { id: animals, label: Animals and their sounds }
  - { id: work, label: Working on the farm }
  - { id: market, label: At the market }
  - { id: weather, label: Weather and seasons }
items:
