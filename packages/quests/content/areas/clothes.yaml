id: clothes
title: Style Corner
intro: Come into the shop, find clothes in your favourite colours and try them on in the fitting room. Learn the names of clothes, sizes and what to say when you shop.
categories:
  - { id: tops, label: Tops and dresses }
  - { id: bottoms, label: Trousers and skirts }
  - { id: shoes, label: Shoes and socks }
  - { id: accessories, label: Hats, glasses and bags }
  - { id: describe, label: "Patterns, materials and fit" }
  - { id: shop, label: In the shop }
groups:
  - { id: help, label: Asking for help }
  - { id: size, label: Size and fit }
  - { id: colour, label: Colours and styles }
  - { id: paying, label: Paying and returns }
  - { id: compliments, label: Compliments }
items:
  # ---------------------------------------------------------------- tops
  - id: t-shirt
