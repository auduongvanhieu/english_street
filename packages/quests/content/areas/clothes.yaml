  # ---------------------------------------------------------------- describing clothes
  - id: striped
    en: striped
    icon: 🦓
    pos: adjective
    category: describe
    note: with lines (stripes)
    sentences:
      - { en: I have a striped T-shirt., level: A1 }
      - { en: The sailor is wearing a blue and white striped shirt., level: A2 }
      - { en: "Vertical stripes can make you look taller.", level: B1 }
  - id: spotted
    en: spotted
    icon: 🔴
    pos: adjective
    category: describe
    note: "with round spots — also called polka dot"
    sentences:
      - { en: The dress is red and spotted., level: A1 }
      - { en: She loves her spotted scarf., level: A2 }
      - { en: Polka dots were very popular in the 1950s., level: B1 }
  - id: checked
    en: checked
    icon: 🏁
    pos: adjective
    category: describe
    note: with squares, like a chessboard (Americans say plaid or checkered)
    sentences:
      - { en: He has a checked shirt., level: A1 }
      - { en: A checked skirt is part of my uniform., level: A2 }
      - { en: Checked shirts are popular with people who work outdoors., level: B1 }
  - id: cotton
    en: cotton
    icon: ☁️
    category: describe
    note: "Uncountable. A soft material made from a plant."
    sentences:
      - { en: This T-shirt is cotton., level: A1 }
      - { en: Cotton is soft and cool., level: A2 }
      - { en: "Cotton clothes are easy to wash, but they crease easily.", level: B1 }
  - id: wool
    en: wool
    icon: 🐑
    category: describe
    note: "Uncountable. It comes from sheep."
    sentences:
      - { en: Wool is warm., level: A1 }
      - { en: My scarf is made of wool., level: A2 }
      - { en: "Some people can't wear wool because it makes their skin itch.", level: B1 }
  - id: leather
    en: leather
    icon: 👜
    category: describe
    note: Uncountable. Shoes, belts and bags are often leather.
    sentences:
      - { en: The belt is leather., level: A1 }
      - { en: Leather shoes are strong., level: A2 }
      - { en: "Leather lasts for years if you clean it regularly.", level: B1 }
  - id: tight
    en: tight
    icon: 🤏
    pos: adjective
    category: describe
    note: "opposite: loose"
    sentences:
