  - id: loose
    en: loose
    icon: 🎈
    pos: adjective
    category: describe
    note: "opposite: tight"
    sentences:
      - { en: The hoodie is loose., level: A1 }
      - { en: "This shirt is too loose. Do you have a smaller one?", level: A2 }
      - { en: Loose clothes keep you cool when the weather is hot and humid., level: B1 }
  # ---------------------------------------------------------------- in the shop
  - id: size
    en: size
    plural: sizes
    icon: 📏
    category: shop
    note: "Sizes: S (small), M (medium), L (large), XL (extra large)."
    sentences:
      - { en: What size are you?, level: A1 }
      - { en: "Do you have this in a large? — Sorry, we only have small and medium.", level: A2 }
      - { en: "Sizes are different in every shop, so always try things on first.", level: B1 }
  - id: fitting-room
    en: fitting room
    plural: fitting rooms
    icon: 🚪
    category: shop
    note: The small room where you try clothes on. Americans say dressing room.
    sentences:
      - { en: Where is the fitting room?, level: A1 }
      - { en: You can take three items into the fitting room., level: A2 }
      - { en: "There was a long queue for the fitting rooms because of the sale.", level: B1 }
  - id: mirror
    en: mirror
    plural: mirrors
    icon: 🪞
    category: shop
    sentences:
      - { en: Look in the mirror., level: A1 }
      - { en: There's a big mirror next to the fitting rooms., level: A2 }
      - { en: "I looked in the mirror and decided the colour didn't suit me.", level: B1 }
  - id: try-on
    en: try on
    icon: 🙋
    pos: verb
    category: shop
    note: "try something on, try it on"
    sentences:
      - { en: Can I try it on?, level: A1 }
      - { en: "I tried on three dresses, but none of them fitted.", level: A2 }
      - { en: "You should try the shoes on with the socks you'll wear with them.", level: B1 }
  - id: fit
    en: fit
    icon: ✅
    pos: verb
    category: shop
    note: "It fits = it's the right size. It suits you = it looks good on you."
    sentences:
      - { en: It fits!, level: A1 }
      - { en: "The jacket doesn't fit. It's too big.", level: A2 }
      - { en: "The jeans fit me perfectly, and the colour suits me too.", level: B1 }
  - id: price-tag
    en: price tag
    plural: price tags
    icon: 🏷️
    category: shop
    sentences:
      - { en: Look at the price tag., level: A1 }
      - { en: "There's no price tag on this hat. How much is it?", level: A2 }
      - { en: Don't take the price tags off until you're sure you want to keep it., level: B1 }
  - id: receipt
    en: receipt
    plural: receipts
    icon: 🧾
    category: shop
    note: "The 'p' is silent: /rɪˈsiːt/."
    sentences:
      - { en: Here is your receipt., level: A1 }
      - { en: Keep the receipt if you want to change it., level: A2 }
      - { en: "You can return anything within 30 days, as long as you have the receipt.", level: B1 }
  - id: on-sale
    en: on sale
    icon: 🔖
    pos: phrase
    category: shop
    note: cheaper than usual for a short time
    sentences:
      - { en: The hats are on sale., level: A1 }
      - { en: "Everything is half price in the sale this week.", level: A2 }
      - { en: "It was on sale, so I got it for half the normal price.", level: B1 }
phrases:
  - { en: "Can I help you?", level: A1, group: help }
  - { en: "I'm just looking, thanks.", level: A1, group: help }
  - { en: "I'm looking for a jacket.", level: A1, group: help }
  - { en: "Where are the fitting rooms?", level: A1, group: help }
  - { en: "Excuse me, do you sell school uniforms?", level: A2, group: help }
  - { en: "What size are you?", level: A1, group: size }
  - { en: "Can I try it on?", level: A1, group: size }
  - { en: "It's too big. Do you have a smaller size?", level: A1, group: size }
  - { en: "These jeans are a bit tight around the waist.", level: A2, group: size }
  - { en: "It fits perfectly!", level: A2, group: size }
  - { en: "Do you have this in red?", level: A1, group: colour }
  - { en: "What other colours do you have?", level: A1, group: colour }
  - { en: "I'd prefer something plain, without a pattern.", level: B1, group: colour }
  - { en: "Which one goes better with my blue jeans?", level: B1, group: colour }
  - { en: "How much is this hoodie?", level: A1, group: paying }
  - { en: "I'll take it.", level: A1, group: paying }
  - { en: "Can I pay by card?", level: A1, group: paying }
  - { en: "I'd like to return these shoes. They're too small.", level: A2, group: paying }
  - { en: "Could I change it for a bigger size?", level: A2, group: paying }
  - { en: "Do you have the receipt?", level: A2, group: paying }
  - { en: "You can get a refund or exchange it within 30 days.", level: B1, group: paying }
  - { en: "That colour really suits you!", level: A2, group: compliments }
  - { en: "I love your dress!", level: A1, group: compliments }
  - { en: "You look great in that jacket.", level: A2, group: compliments }
  - { en: "Where did you get those trainers? They're really cool.", level: B1, group: compliments }
quiz:
  - id: q-too-big
    question: "The shirt is too big. What do you ask?"
    options: ["Do you have a smaller size?", "Do you have a bigger size?", "Can I pay by card?", "Where is the mirror?"]
    answer: 0
    level: A1
  - id: q-try-on
    question: "You want to see if a jacket fits. What do you say?"
    options: ["Can I try it on?", "Can I try it in?", "Can I put it off?", "Can I wear it out?"]
    answer: 0
    level: A1
  - id: q-pair
    question: "Which one do we say?"
    options: ["a pair of jeans", "a jean", "two jean", "a jeans"]
    answer: 0
    level: A1
  - id: q-feet
    question: "Which of these do you wear on your feet?"
    options: ["trainers", "a scarf", "a cap", "a belt"]
    answer: 0
    level: A1
  - id: q-colour
    question: "\"Do you have this ___ green?\""
    options: ["in", "on", "at", "of"]
    answer: 0
    level: A2
  - id: q-suit
    question: "\"That colour really ___ you!\" (it looks good on you)"
    options: ["suits", "fits", "wears", "tries"]
    answer: 0
    level: A2
  - id: q-return
    question: "Your new shoes are too small. You go back to the shop to get your money back. You want a…"
    options: ["refund", "receipt", "price tag", "fitting room"]
    answer: 0
    level: A2
  - id: q-material
    question: "Which material comes from sheep?"
    options: ["wool", "cotton", "leather", "denim"]
    answer: 0
    level: A2
  - id: q-sale
    question: "A $40 jacket is on sale at half price. How much is it now?"
    options: ["$20", "$40", "$10", "$80"]
    answer: 0
    level: A2
  - id: q-wearing
    question: "Choose the correct sentence."
    options: ["Today I'm wearing a striped T-shirt.", "Today I'm wear a striped T-shirt.", "Today I wearing a T-shirt striped.", "Today I'm wearing a T-shirt striped."]
    answer: 0
    level: B1
