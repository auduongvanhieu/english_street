id: sports
title: Sunny Sports Park
intro: Run, jump and play! Learn the names of sports, action words and how to talk about what you can do and what you like. Follow the coach's commands in the mini games.
categories:
  - { id: ball, label: Ball sports }
  - { id: other, label: Other sports }
  - { id: actions, label: Action words }
  - { id: equipment, label: Equipment }
  - { id: places, label: "Places and people" }
  - { id: describe, label: "Describing and comparing" }
groups:
