  - { en: "I'm so sorry about that. I'll send someone up right away.", level: B1, group: desk }
  - { en: "Enjoy your stay!", level: A1, group: desk }
  - { en: "How many nights would you like to stay?", level: A2, group: desk }
quiz:
  - id: room-two-beds
    question: "A room with two single beds is a…"
    options: [twin room, double room, single room, suite]
    answer: 0
    level: A2
  - id: polite-complaint
    question: "Which is the most polite way to complain?"
    options: ["Fix my air conditioner now!", "Excuse me, the air conditioner doesn't work.", "Air conditioner bad.", "You broke the air conditioner."]
    answer: 1
    level: A2
  - id: ordinal-14
    question: "How do you say 14/5 as a date?"
    options: [the fourteen of May, the fourteenth of May, the forty of May, the fourth of May]
    answer: 1
    level: A2
  - id: ordinal-22
    question: "Which one is correct?"
    options: [the 22th, the 22st, the 22nd, the 22rd]
    answer: 2
    level: A2
  - id: lift-us
    question: "In American English, a \"lift\" is an…"
    options: [escalator, elevator, apartment, airport]
    answer: 1
    level: A2
  - id: check-in-time
    question: "\"Check-in is ___ 2 pm.\""
    options: [from, on, in, at the]
    answer: 0
    level: A2
  - id: nights-price
    question: "A double room is $90 a night. You stay 3 nights. How much is it?"
    options: [$90, $180, $270, $300]
    answer: 2
    level: A1
  - id: lost-key
    question: "You lost your key card. What do you say?"
    options: ["I've lost my key card.", "I've lost my key cards room.", "My key card is lose.", "I lose key card yesterday."]
    answer: 0
    level: A2
  - id: spell-name
    question: "The receptionist says: \"Could you spell that, please?\" She wants…"
    options: [your phone number, the letters of your name, your room number, your passport]
    answer: 1
    level: A2
  - id: luggage-countable
    question: "Choose the correct sentence."
    options: [I have three luggages., I have three pieces of luggage., I have a luggages., I have three luggage.]
    answer: 1
    level: B1
