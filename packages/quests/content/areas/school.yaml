  - { en: "Close your books.", level: A1, group: teacher }
  - { en: "Put up your hand.", level: A1, group: teacher }
  - { en: "Work in pairs.", level: A1, group: teacher }
  - { en: "Be quiet, please.", level: A1, group: teacher }
  - { en: "Well done! Good job!", level: A1, group: teacher }
