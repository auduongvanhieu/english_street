  - { en: "Thanks! I'll give it back after the lesson.", level: A2, group: borrow }
quiz:
  - id: subject-paint
    question: "We paint and draw pictures in…"
    options: [Maths, Art, Music, Geography]
    answer: 1
    level: A1
  - id: subject-maps
    question: "We learn about countries, rivers and maps in…"
    options: [History, Science, Geography, PE]
    answer: 2
    level: A1
  - id: after-monday
    question: "What day comes after Tuesday?"
    options: [Monday, Thursday, Wednesday, Friday]
    answer: 2
    level: A1
  - id: weekend
    question: "Which two days are the weekend?"
    options: [Monday and Tuesday, Friday and Monday, Saturday and Sunday, Thursday and Friday]
    answer: 2
    level: A1
  - id: hand
    question: "You want to answer a question in class. What do you do?"
    options: [Put up your hand., Close your eyes., Go to sleep., Stand on the desk.]
    answer: 0
    level: A1
  - id: borrow
    question: "You forgot your pencil. What do you say to your friend?"
    options: ["Give me pencil!", "Can I borrow your pencil, please?", "Where pencil you?", "Pencil is me."]
    answer: 1
    level: A1
  - id: spell-wed
    question: "Which word is spelled correctly?"
    options: [Wensday, Wednesday, Wedensday, Wendesday]
    answer: 1
    level: A2
  - id: time-quarter
    question: "Maths starts at 9:15. That's…"
    options: [nine fifteen o'clock, a quarter past nine, a quarter to nine, half past nine]
    answer: 1
    level: A2
  - id: scissors
    question: "Can I borrow your ___? I want to cut this paper."
    options: [ruler, eraser, scissors, crayon]
    answer: 2
    level: A1
  - id: favourite
    question: "“What's your favourite subject?” — Choose the best answer."
    options: ["Yes, I do.", "It's Music. I love singing.", "At nine o'clock.", "On Monday."]
    answer: 1
    level: A2
