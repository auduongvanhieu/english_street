quiz:
  - id: where-ball
    question: "The ball is ___ the bed. (You can't see it from above.)"
    options: [under, on, in, between]
    answer: 0
    level: A1
  - id: where-cups
    question: "Where do we keep the cups and plates?"
    options: [in the cupboard, in the bath, under the bed, in the garden]
    answer: 0
    level: A1
  - id: room-sleep
    question: "Which room do you sleep in?"
    options: [the kitchen, the bedroom, the bathroom, the garden]
    answer: 1
    level: A1
  - id: room-cook
    question: "Mum is cooking dinner. Where is she?"
    options: [in the bathroom, in the bedroom, in the kitchen, in the garden]
    answer: 2
    level: A1
  - id: milk-fridge
    question: "The milk is cold. It's ___ the fridge."
    options: [on, in, under, behind]
    answer: 1
    level: A1
  - id: routine-order
    question: "What do you usually do first in the morning?"
    options: [go to bed, have dinner, get up, do my homework]
    answer: 2
    level: A1
  - id: time-half
    question: "7:30 is…"
    options: [seven o'clock, half past seven, half past six, a quarter past seven]
    answer: 1
    level: A1
  - id: between
    question: "The lamp is ___ the bed and the desk."
    options: [next, between, behind of, in front]
    answer: 1
    level: A2
  - id: chore-bin
