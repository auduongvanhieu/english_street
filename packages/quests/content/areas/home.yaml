id: home
title: Cozy Home
intro: Welcome to Cozy Home! Look around the rooms, learn the names of things in the house and help Mum with the chores.
categories:
  - { id: rooms, label: Rooms and the house }
  - { id: furniture, label: Furniture }
  - { id: kitchen, label: In the kitchen }
  - { id: bathroom, label: In the bathroom }
  - { id: things, label: Things around the house }
  - { id: chores, label: Chores }
  - { id: routine, label: My day }
groups:
