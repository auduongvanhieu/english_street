  - id: bear
    en: bear
    plural: bears
    icon: 🐻
    category: big
    sentences:
      - { en: The bear is brown and big., level: A1 }
      - { en: Bears love honey and fish., level: A2 }
      - { en: Many bears sleep through the winter., level: B1 }
