id: zoo
title: Sunny Hills Zoo
intro: Walk around the zoo, meet the animals and learn their names. Tap an animal to hear it, read about it and practise sentences.
categories:
  - { id: big, label: Big animals }
  - { id: cats, label: Big cats }
  - { id: birds, label: Birds }
  - { id: others, label: Other animals }
groups:
  - { id: look, label: Looking at animals }
  - { id: describe, label: Describing animals }
  - { id: compare, label: Comparing }
  - { id: visit, label: Visiting the zoo }
items:
  - id: lion
    en: lion
    plural: lions
    icon: 🦁
    category: cats
    note: A male lion has a mane.
    sentences:
      - { en: The lion is sleeping in the sun., level: A1 }
      - { en: Lions live in groups called prides., level: A2 }
      - { en: "If you listen carefully, you can hear the lion roar.", level: B1 }
    fact: A lion's roar can be heard from 8 kilometres away.
  - id: tiger
    en: tiger
    plural: tigers
    icon: 🐯
    category: cats
    sentences:
      - { en: The tiger has orange fur and black stripes., level: A1 }
      - { en: Tigers are good swimmers., level: A2 }
      - { en: No two tigers have the same stripes., level: B1 }
    fact: Tigers are the biggest cats in the world.
  - id: elephant
    en: elephant
    plural: elephants
    icon: 🐘
    category: big
    note: "trunk, tusks, big ears"
    sentences:
      - { en: The elephant is very big., level: A1 }
      - { en: The elephant is drinking water with its trunk., level: A2 }
      - { en: Elephants are known for their excellent memory., level: B1 }
