  - id: giraffe
    en: giraffe
    plural: giraffes
    icon: 🦒
    category: big
    sentences:
      - { en: The giraffe has a long neck., level: A1 }
      - { en: Giraffes eat leaves from tall trees., level: A2 }
      - { en: A giraffe only needs about two hours of sleep a day., level: B1 }
    fact: A giraffe's tongue is about 50 centimetres long.
  - id: zebra
    en: zebra
    plural: zebras
    icon: 🦓
    category: big
    sentences:
      - { en: The zebra is black and white., level: A1 }
      - { en: Zebras live in big groups called herds., level: A2 }
      - { en: Scientists think the stripes help to keep flies away., level: B1 }
    fact: Every zebra has its own pattern of stripes.
  - id: monkey
    en: monkey
    plural: monkeys
    icon: 🐒
    category: others
    sentences:
      - { en: The monkey is eating a banana., level: A1 }
      - { en: Monkeys like climbing trees., level: A2 }
      - { en: Some monkeys use their tails to hold on to branches., level: B1 }
