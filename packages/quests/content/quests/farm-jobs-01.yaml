id: farm-jobs-01
npc: farmer
level: A1
title: Help on the Farm
intro: Farmer Jack needs help today. Offer to help and ask what to do.
goals:
  - { id: greet, desc: "Greet the farmer" }
  - { id: offer, desc: "Offer to help (\"Can I help you?\")" }
