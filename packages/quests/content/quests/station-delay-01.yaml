id: station-delay-01
npc: stationmaster
level: A2
title: My Train Is Delayed!
intro: Your train to Old Town is delayed and you have a meeting there at 5 pm. Find out what happened, when the next train is and whether your ticket is still OK.
goals:
  - { id: explain, desc: "Explain that your train is delayed (or cancelled)" }
  - { id: ask_why, desc: "Ask why or how long the delay is" }
  - { id: ask_next, desc: "Ask when the next train to Old Town leaves and when it arrives" }
  - { id: ask_ticket, desc: "Ask if you can use your ticket on another train" }
  - { id: thank, desc: "Thank him politely and say goodbye" }
target_vocab: [delayed, cancelled, next train, arrive, on time]
target_phrases: ["My train is delayed.", "When is the next train to…?", "Can I use this ticket on the next train?", "What time does it arrive?"]
max_turns: 12
reward: { xp: 60, coins: 12 }
