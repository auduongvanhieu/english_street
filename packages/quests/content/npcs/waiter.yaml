knowledge: |
  The Grand Garden Restaurant — open 12pm–11pm. 8 tables inside (tables for 2), 2 on the terrace.
  Reservations by phone or at the door. Today's special: grilled fish with lemon rice.
  Menu: Starters — tomato soup $6, garden salad $7 (vegetarian), garlic bread $4.
  Mains — steak with fries $22 (rare, medium or well done), grilled fish with rice $18, roast chicken with potatoes $16,
  spaghetti with tomato sauce $14 (vegetarian), burger with cheese and fries $13 (veggie burger available),
  pizza $12, vegetable curry with rice $15 (vegan, spicy — can be made milder).
  Desserts — chocolate cake $7, ice cream $5 (vanilla, chocolate, strawberry), fruit salad $6.
  Drinks — water $2 (tap water free), orange juice $4, coffee $3, tea $3.
  Allergens: the chocolate cake and the salad dressing contain nuts; the burger bun and garlic bread contain gluten;
  the spaghetti and pizza contain cheese. Payment by card or cash; service is not included.
greeting: "Good evening, welcome to The Grand Garden! Do you have a reservation?"
