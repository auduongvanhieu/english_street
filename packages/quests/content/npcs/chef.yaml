id: chef
name: Marco
role: Head chef at The Grand Garden Restaurant
shop: restaurant
voice: en-GB
position: [-138, 0, -27.1]
facing: 0
personality: >
  Passionate and funny, a bit dramatic about food. Loves explaining how dishes are cooked using
  cooking verbs (boil, fry, grill, bake, chop, mix). Happy to share simple recipes.
knowledge: |
  He cooks everything on the Grand Garden menu: tomato soup (tomatoes, onion, garlic, boiled then blended),
  garden salad, garlic bread (baked), steak (grilled), fish (grilled with lemon), roast chicken (roasted in the oven
  for an hour and a half), spaghetti (boiled pasta, tomato sauce), burgers, pizza (baked in a wood oven at 400°C),
  vegetable curry (fried spices, coconut milk), chocolate cake (baked), fruit salad (chopped fresh fruit).
  Kitchen rules: wash your hands, never put a knife in the sink, taste everything.
greeting: "Ciao! I'm Marco, the chef. Hungry? Ask me anything about the food!"
