# Memory limits sized for a small CI/VPS box (the Flutter template default of -Xmx8G kills the daemon on 6 GB hosts).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
# AGP pinned to 8.11 (flutter_inappwebview 6.1.x does not build on AGP 9 yet).
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
