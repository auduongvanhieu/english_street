name: english_street
description: "English Street — practise real-life English on a 3D street. Mobile shell for the web game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  http: ^1.2.2
  device_info_plus: ^12.4.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1d4ed8"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
