<!doctype html>
<html lang="en">
  <head>
    <script>
      // In-app browsers (Zalo) inject scripts that call their own bridge object before it exists
      // ("ReferenceError: Can't find variable: zaloJSV2"). A do-nothing stand-in keeps those calls quiet;
      // Zalo replaces it with the real bridge when it has one.
      (function () {
        if (window.zaloJSV2) return;
        var noop = function () {};
        window.zaloJSV2 = typeof Proxy === 'function' ? new Proxy({}, { get: function () { return noop; } }) : { zalo_h5_event_handler: noop };
      })();
    </script>
