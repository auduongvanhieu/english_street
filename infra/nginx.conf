server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
  gzip_min_length 1024;

  # Hashed build assets: cache for a year.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # 3D models never change without a rename either, but keep a shorter TTL to be safe.
  location /models/ { add_header Cache-Control "public, max-age=604800"; }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
