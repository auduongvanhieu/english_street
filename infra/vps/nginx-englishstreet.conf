# English Street - https://englishstreet.coffeesos.online   (one domain, path routing)
#   /      -> static Vite build in /var/www/englishstreet.coffeesos.online
#   /api/  -> Fastify API on 127.0.0.1:4600   (prefix stripped)
#   /ws/   -> Colyseus game server on 127.0.0.1:2600 (prefix stripped, WebSocket)
# Install: copy to /etc/nginx/conf.d/, `nginx -t && systemctl reload nginx`,
# then `certbot --nginx -d englishstreet.coffeesos.online --redirect` adds the TLS block.

upstream englishstreet_api  { server 127.0.0.1:4600; keepalive 16; }
upstream englishstreet_game { server 127.0.0.1:2600; keepalive 16; }

server {
    server_name englishstreet.coffeesos.online;

    root /var/www/englishstreet.coffeesos.online;
    index index.html;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml model/gltf-binary application/octet-stream;
    gzip_min_length 1024;

    # API (NPC replies can take a while with the real model)
    location /api/ {
        proxy_pass http://englishstreet_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Colyseus: matchmaking HTTP + WebSocket upgrade, both under /ws/
    location /ws/ {
        proxy_pass http://englishstreet_game/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Content-hashed build assets: cache forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /models/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA shell: never cache so a new build is picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    listen 80;
}
